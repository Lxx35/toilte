<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康乐园如厕地图 · 中山大学南校园</title>
<meta name="theme-color" content="#F3EDDF">
<meta name="description" content="中山大学广州校区南校园洗手间分布示意图：21 个点位、开放时间、纸巾与无障碍信息，支持按楼栋查找与步行距离估算。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23A8452E'/%3E%3Cpath d='M32 52c0 0-15-14-15-24a15 15 0 0 1 30 0c0 10-15 24-15 24z' fill='%23FBF3E1'/%3E%3Ccircle cx='32' cy='28' r='5.5' fill='%23A8452E'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#26301F;
    --muted:#7B7462;
    --line:#E3D8C0;
    --paper:#FBF7EC;
    --green:#2E5D46;
    --green-deep:#1F4433;
    --brick:#A8452E;
    --brick-deep:#8C3423;
    --gold:#C9A227;
    --shadow:0 22px 48px -28px rgba(46,52,34,.55);
    --shadow-sm:0 8px 18px -12px rgba(46,52,34,.45);
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--ink);
    font-family:var(--sans);
    background:
      radial-gradient(1100px 520px at 6% -12%, #F0E6D0 0%, rgba(240,230,208,0) 62%),
      radial-gradient(900px 520px at 102% -6%, #E6EEDC 0%, rgba(230,238,220,0) 58%),
      #F3EDDF;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{font-family:inherit;color:inherit}
  ::selection{background:#D9E4C9;color:#26301F}
  :focus-visible{outline:2px solid #7FA184;outline-offset:2px}

  .app{
    height:100vh;
    height:100dvh;
    max-width:1560px;
    margin:0 auto;
    padding:16px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:16px;flex:0 0 auto;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .emblem{
    width:48px;height:48px;border-radius:15px;flex:none;
    background:linear-gradient(150deg,#B9502F 0%,#8C3423 78%);
    color:#FCF3E1;display:grid;place-items:center;
    font-family:var(--serif);font-size:25px;line-height:1;
    box-shadow:0 10px 22px -12px rgba(140,52,35,.85), inset 0 1px 0 rgba(255,255,255,.25);
    letter-spacing:0;
  }
  .brand h1{
    margin:0;font-family:var(--serif);font-size:25px;font-weight:600;
    letter-spacing:.07em;line-height:1.15;
  }
  .brand .sub{
    margin:4px 0 0;font-size:10.5px;color:var(--muted);
    letter-spacing:.19em;text-transform:uppercase;
  }
  .top-right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .stats{display:flex;gap:22px;flex:none}
  .stats div{display:flex;flex-direction:column;gap:3px;white-space:nowrap}
  .stats b{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1;color:var(--green-deep)}
  .stats span{font-size:10.5px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
  .urgent{
    border:0;border-radius:999px;cursor:pointer;
    padding:11px 19px;font-size:14px;font-weight:600;letter-spacing:.08em;
    color:#FFF6E8;background:linear-gradient(135deg,#B9502F,#8C3423);
    display:flex;align-items:center;gap:8px;
    box-shadow:0 12px 24px -12px rgba(168,69,46,.9);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .urgent:hover{transform:translateY(-1px);box-shadow:0 16px 28px -12px rgba(168,69,46,.95)}
  .urgent:active{transform:translateY(0)}
  .pulse-dot{
    width:7px;height:7px;border-radius:50%;background:#FFE7C8;flex:none;
    animation:dot 1.9s ease-out infinite;
  }
  @keyframes dot{
    0%{box-shadow:0 0 0 0 rgba(255,231,200,.75)}
    70%{box-shadow:0 0 0 9px rgba(255,231,200,0)}
    100%{box-shadow:0 0 0 0 rgba(255,231,200,0)}
  }

  /* ---------- layout ---------- */
  .layout{
    flex:1;min-height:0;
    display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:16px;
  }
  .map-wrap{
    position:relative;min-height:0;border-radius:22px;overflow:hidden;
    border:1px solid #E0D5BC;background:#F7F2E3;
    box-shadow:var(--shadow);
  }
  #map{display:block;width:100%;height:100%}

  /* ---------- map hud ---------- */
  .hud{
    position:absolute;z-index:4;display:flex;align-items:center;gap:8px;
    font-size:11px;color:#6E6754;pointer-events:none;
  }
  .hud-tl{top:14px;left:16px;flex-direction:column;align-items:flex-start;gap:4px}
  .hud-tag{
    font-family:var(--serif);font-size:13px;letter-spacing:.14em;color:#41503A;
    background:rgba(251,247,236,.8);border:1px solid rgba(203,190,161,.55);
    padding:5px 11px;border-radius:999px;backdrop-filter:blur(4px);
  }
  .hud-note{font-size:10px;letter-spacing:.1em;opacity:.8}
  .hud-tr{top:10px;right:14px;opacity:.75}
  .hud-br{top:56px;right:16px;flex-direction:column;align-items:flex-end;gap:3px}
  .scale-line{
    display:block;width:90px;height:6px;border-left:1px solid #8B8269;border-right:1px solid #8B8269;
    border-bottom:1px solid #8B8269;border-radius:0 0 2px 2px;
  }
  .scale-text{font-size:10px;color:#6E6754;letter-spacing:.06em}

  /* ---------- svg map base ---------- */
  .bounds{fill:#E9EFDB;stroke:#C3B997;stroke-width:1.6;stroke-dasharray:7 6}
  .lawn{fill:#D3E2B8;opacity:.9}
  .lawn-soft{fill:#DCE8C6;opacity:.75}
  .road-case{fill:none;stroke:#E5DAC1;stroke-linecap:round;stroke-linejoin:round}
  .road{fill:none;stroke:#FFFDF4;stroke-linecap:round;stroke-linejoin:round}
  .road-out{fill:none;stroke:#DED3B9;stroke-linecap:round}
  .road-out-line{fill:none;stroke:#FFFDF6;stroke-linecap:round;stroke-dasharray:16 13}
  .river{fill:#BAD5DC}
  .river-hi{fill:none;stroke:#F4FBFB;stroke-width:1.4;opacity:.55}
  .water{fill:#B9D6DC;stroke:#9EC2CA;stroke-width:1.2}
  .tree{fill:#9DBE87;opacity:.72}
  .track-outer{fill:#DCC9A8;stroke:#C6B08B;stroke-width:1.2}
  .track-inner{fill:#CFE0B4;stroke:#B6CB98;stroke-width:1.2}
  .blabel{
    fill:#4B4536;font-size:9.5px;font-family:var(--sans);
    text-anchor:middle;pointer-events:none;letter-spacing:.02em;
  }
  .blabel.small{font-size:7.8px}
  .blabel.water-label{fill:#4F7780;font-size:10px;letter-spacing:.25em}
  .road-label{fill:#8A8168;font-size:9px;letter-spacing:.34em;font-family:var(--sans)}
  .gate-label{fill:#8C3423;font-size:9px;letter-spacing:.14em;font-family:var(--serif)}
  .bldg{fill:#EADCCA;stroke:#CBB69C;stroke-width:1.1}
  .bldg.brick{fill:#E4C7B2;stroke:#C7A98F}
  .bldg.court{fill:#DCC9A8;stroke:#C3AC86}
  .bldg.water{fill:#B9D6DC;stroke:#9EC2CA}
  .bldg.gate{fill:#B9502F;stroke:#8C3423;stroke-width:.8}
  .statue{fill:#C9BFA6;stroke:#B2A68A;stroke-width:.8}
  .pav{fill:#E9D9C4;stroke:#BFA98B;stroke-width:1}
  .pav-roof{fill:#8E9C86;opacity:.55}

  /* ---------- markers ---------- */
  .marker{cursor:pointer;transition:opacity .3s ease}
  .marker .pinwrap{transform-box:fill-box;transform-origin:50% 100%;transition:transform .18s ease}
  .marker:hover .pinwrap{transform:scale(1.12)}
  .marker .pinbody{fill:var(--c);stroke:#FBF8EF;stroke-width:2.4;stroke-linejoin:round}
  .marker .pinc{fill:var(--c)}
  .marker .pnum{
    fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle;
    dominant-baseline:central;font-family:var(--sans);pointer-events:none;
  }
  .marker .halo{fill:var(--c);opacity:.16;transform-box:fill-box;transform-origin:center}
  .marker.selected .pinwrap{transform:scale(1.22)}
  .marker.selected .halo{animation:haloPulse 1.9s ease-out infinite}
  @keyframes haloPulse{
    0%{transform:scale(.75);opacity:.4}
    75%{transform:scale(2.3);opacity:0}
    100%{transform:scale(2.3);opacity:0}
  }
  .marker.dim{opacity:.16}
  .marker.dim:hover{opacity:.5}
  .marker.selected.dim{opacity:1}

  #route{
    fill:none;stroke:#B0502F;stroke-width:3;stroke-linecap:round;
    stroke-dasharray:9 8;opacity:0;transition:opacity .3s ease;
  }
  #route.show{opacity:.95;animation:dashMove 1.1s linear infinite}
  @keyframes dashMove{to{stroke-dashoffset:-34}}
  #origin{opacity:0;transition:opacity .3s ease}
  #origin.show{opacity:1}
  #origin .dot{fill:#2B6E9B;stroke:#fff;stroke-width:2.2}
  #origin .wave{
    fill:none;stroke:#2B6E9B;stroke-width:1.6;opacity:.6;
    transform-box:fill-box;transform-origin:center;
    animation:wave 2.1s ease-out infinite;
  }
  @keyframes wave{
    0%{transform:scale(.7);opacity:.65}
    100%{transform:scale(2.5);opacity:0}
  }

  /* ---------- tooltip ---------- */
  .tip{
    position:absolute;z-index:9;pointer-events:none;
    transform:translate(-50%,-100%);margin-top:-8px;
    background:#26301F;color:#F7F2E2;border-radius:10px;
    padding:7px 10px;font-size:11.5px;line-height:1.45;
    box-shadow:0 10px 22px -12px rgba(0,0,0,.6);
    opacity:0;transition:opacity .15s ease;white-space:nowrap;
  }
  .tip.show{opacity:1}
  .tip b{color:#F0D79A;font-weight:700}
  .tip span{display:block;font-size:10px;color:#C4C0AC;letter-spacing:.03em}

  /* ---------- detail card ---------- */
  .detail{
    position:absolute;z-index:7;left:16px;bottom:16px;
    width:min(348px,calc(100% - 32px));
    background:rgba(252,248,238,.97);
    border:1px solid #E2D6BC;border-radius:18px;
    padding:15px 16px 14px;
    box-shadow:0 24px 50px -26px rgba(40,45,30,.55);
    backdrop-filter:blur(10px);
    opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .26s ease, transform .26s ease;
    max-height:calc(100% - 32px);overflow-y:auto;
  }
  .detail.show{opacity:1;transform:none;pointer-events:auto}
  .detail.right{left:auto;right:16px}
  .detail-close{
    position:absolute;top:10px;right:10px;width:26px;height:26px;
    border:0;border-radius:50%;background:#EFE7D3;color:#7A725E;
    font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:background .16s ease;
  }
  .detail-close:hover{background:#E3D8BE;color:#3C3A2E}
  .detail-head{display:flex;gap:11px;align-items:flex-start;padding-right:26px}
  .badge{
    width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;
    font-size:13.5px;font-weight:700;display:grid;place-items:center;flex:none;
    box-shadow:0 6px 12px -6px rgba(0,0,0,.4);
  }
  .detail-head h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.03em;line-height:1.3}
  .detail-head p{margin:3px 0 0;font-size:11px;color:var(--muted);letter-spacing:.02em}
  .detail .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;
    margin:13px 0 11px;padding:11px;border-radius:12px;
    background:#F3ECDA;border:1px solid #E8DEC6;
  }
  .detail .stats div{display:flex;flex-direction:column;gap:2px;min-width:0;white-space:normal}
  .detail .stats span{font-size:9.5px;color:#8A8168;letter-spacing:.1em}
  .detail .stats b{font-size:11.5px;font-weight:600;line-height:1.35;color:#3C3A2E}
  .detail .stats b.yes{color:#33684A}
  .detail .stats b.no{color:#9A6A3A}
  .crowd{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#7B7462;margin-bottom:10px}
  .crowd .bar{flex:1;height:6px;border-radius:99px;background:#E7DEC9;overflow:hidden}
  .crowd .bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .crowd b{font-size:10.5px;color:#5C5847;font-weight:600}
  .tipbox{
    border-left:2px solid var(--gold);background:#FBF4E2;
    padding:9px 11px;border-radius:0 10px 10px 0;margin-bottom:12px;
  }
  .tipbox span{font-size:9px;letter-spacing:.2em;color:#A98C2F;font-weight:700}
  .tipbox p{margin:4px 0 0;font-size:11.5px;line-height:1.65;color:#5A5545}
  .detail-foot{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .walk{font-size:11px;color:var(--muted);line-height:1.4}
  .walk b{color:var(--brick);font-weight:600}
  .btn-ghost{
    border:1px solid #C9BC9E;background:#FFFCF2;border-radius:999px;
    padding:7px 13px;font-size:11.5px;font-weight:600;color:#5C5847;
    cursor:pointer;transition:.18s;flex:none;
  }
  .btn-ghost:hover{background:var(--green);border-color:var(--green);color:#F7F2E2}

  /* ---------- panel ---------- */
  .panel{
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
    background:rgba(252,249,241,.88);
    border:1px solid #E3D9C2;border-radius:22px;
    box-shadow:var(--shadow);
  }
  .panel-head{padding:16px 16px 12px;border-bottom:1px solid #EBE1CB;flex:0 0 auto}
  .ph-row{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
  .ph-row h2{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.08em}
  .count{
    font-size:10.5px;color:#6E6754;background:#EFE7D3;border-radius:999px;
    padding:2px 8px;letter-spacing:.05em;
  }
  .search{position:relative;margin-bottom:11px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .search input{
    width:100%;border:1px solid var(--line);background:#FFFCF3;border-radius:11px;
    padding:9px 12px 9px 33px;font-size:12.5px;font-family:inherit;color:var(--ink);
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .search input::placeholder{color:#A79E87;letter-spacing:.03em}
  .search input:focus{outline:none;border-color:#9DB69A;box-shadow:0 0 0 3px rgba(143,174,147,.18)}
  .mini-label{
    font-size:9.5px;letter-spacing:.18em;color:#9A927C;flex:none;padding-top:5px;
  }
  .origin-row{display:flex;gap:9px;align-items:flex-start;margin-bottom:11px}
  .origin-chips{
    display:flex;gap:5px;flex:1;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  .origin-chips::-webkit-scrollbar{display:none}
  .ochip{
    border:1px dashed #CCBF9F;background:transparent;border-radius:999px;
    padding:3.5px 8px;font-size:10.5px;color:#6E6754;cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .ochip:hover{border-color:#A99B7B;color:#3C3A2E}
  .ochip.active{
    border-style:solid;border-color:#8FAE93;background:#E9F0E3;color:#2E5D46;font-weight:600;
  }
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chip{
    border:1px solid var(--line);background:#FFFCF3;border-radius:999px;
    padding:5px 11px;font-size:11.5px;color:#5C5847;cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .chip:hover{border-color:#C9BC9E;background:#fff}
  .chip.active{background:var(--green);border-color:var(--green);color:#F7F2E2;font-weight:600}
  .chip.feat.active{background:#8C5A2F;border-color:#8C5A2F;color:#FFF8EA}
  .panel-body{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 10px}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:#DDD2B8;border-radius:99px}
  .list{display:flex;flex-direction:column;gap:2px}
  .item{
    display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
    background:transparent;border:1px solid transparent;border-radius:14px;
    padding:10px;cursor:pointer;transition:background .16s ease,border-color .16s ease;
  }
  .item:hover{background:#FFFCF2;border-color:var(--line)}
  .item.active{background:#FFFCF2;border-color:#CBBD9E;box-shadow:var(--shadow-sm)}
  .item .num{
    width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;
    font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px;
  }
  .item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .item-title{font-size:13px;font-weight:600;letter-spacing:.01em;color:#33301F}
  .item-sub{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .tag{font-size:9.5px;padding:1px 6px;border-radius:99px;background:#EFE7D4;color:#77705C;letter-spacing:.03em}
  .tag.paper{background:#E5F0E6;color:#3C6B4C}
  .tag.access{background:#E4ECF6;color:#3D5F86}
  .tag.h24{background:#F6E7CF;color:#97622A}
  .dist{
    font-size:11.5px;color:var(--brick);font-weight:600;white-space:nowrap;margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .empty{padding:36px 16px;text-align:center;color:#9A927C;font-size:12px;line-height:1.8}
  .empty b{display:block;font-family:var(--serif);font-size:14px;color:#6E6754;margin-bottom:4px}
  .panel-foot{
    flex:0 0 auto;padding:11px 16px 13px;border-top:1px solid #EBE1CB;background:#FAF5E8;
  }
  .legend{display:grid;grid-template-columns:repeat(4,auto);gap:6px 12px;justify-content:flex-start;margin-bottom:8px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:10px;color:#6E6754;letter-spacing:.04em}
  .legend i{width:8px;height:8px;border-radius:50%;display:block}
  .disclaimer{margin:0;font-size:9.5px;line-height:1.6;color:#9A927C;letter-spacing:.02em}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;z-index:60;left:50%;bottom:30px;transform:translate(-50%,16px);
    background:#22331F;color:#F6F1E2;border-radius:999px;padding:10px 19px;
    font-size:12.5px;letter-spacing:.03em;box-shadow:0 16px 30px -16px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .26s ease, transform .26s ease;
    max-width:min(560px,calc(100% - 40px));text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:1180px){
    .stats{display:none}
    .layout{grid-template-columns:minmax(0,1fr) 356px}
  }
  @media (max-width:1120px){
    .app{height:auto;min-height:100dvh;padding:14px}
    .layout{grid-template-columns:1fr;grid-template-rows:auto auto}
    .map-wrap{aspect-ratio:10/8.2;height:auto;min-height:0}
    #map{height:100%}
    .panel{max-height:none}
    .panel-body{max-height:52vh}
    .brand h1{font-size:21px}
    .brand .sub{font-size:9px;letter-spacing:.13em}
    .top-right{gap:10px}
  }
  @media (max-width:620px){
    .map-wrap{aspect-ratio:1/0.98}
    .detail, .detail.right{left:10px;right:10px;bottom:10px;width:auto;padding:14px}
    .hud-tl{top:10px;left:10px}
    .hud-tag{font-size:11px;padding:4px 9px}
    .hud-note{display:none}
    .urgent{padding:9px 14px;font-size:12.5px}
    .stats{display:none}
    .blabel.small,.road-label{display:none}
    .marker .pinwrap{transform:scale(1.28)}
    .marker:hover .pinwrap{transform:scale(1.36)}
    .marker.selected .pinwrap{transform:scale(1.42)}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="emblem" aria-hidden="true">康</div>
      <div>
        <h1>康乐园如厕地图</h1>
        <p class="sub">SYSU · SOUTH CAMPUS · WHERE TO GO</p>
      </div>
    </div>
    <div class="top-right">
      <div class="stats">

  var listEl = document.getElementById("list");
  var detailEl = document.getElementById("detail");
  var tipEl = document.getElementById("tip");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function $(sel, root){ return (root || document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /* ---------- buildings ---------- */
  document.getElementById("buildings").innerHTML = BUILDINGS.map(function(b){
    return '<g>' +
      '<rect class="bldg ' + (b.tone || "") + '" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" rx="4"/>' +
      '<text class="blabel' + (b.small ? " small" : "") + '" x="' + b.lx + '" y="' + b.ly + '">' + b.label + '</text>' +
      '</g>';
  }).join("");

  /* ---------- markers ---------- */
  markersG.innerHTML = TOILETS.map(function(t){
    var c = CATS[t.cat].color;
    return '<g class="marker" data-id="' + t.id + '" style="--c:' + c + '" transform="translate(' + t.x + ',' + t.y + ')" role="button" tabindex="0" aria-label="' + t.name + '">' +
      '<circle class="halo" cx="0" cy="-16" r="15"/>' +
      '<g class="pinwrap">' +
        '<path class="pinbody" d="M0 0 L-6.5 -11 A13 13 0 1 1 6.5 -11 Z"/>' +
        '<circle class="pinc" cx="0" cy="-16" r="12.4"/>' +
        '<text class="pnum" x="0" y="-16">' + t.id + '</text>' +
      '</g>' +
      '<circle cx="0" cy="-16" r="32" fill="transparent"/>' +
    '</g>';
  }).join("");

  function getToilet(id){ return TOILETS.filter(function(t){ return t.id === id; })[0]; }
  function getOrigin(){ return ORIGINS[state.origin]; }

  function meters(t){
    var o = getOrigin();
    var d = Math.hypot(t.x - o.x, t.y - o.y);
    return Math.max(10, Math.round(d * 1.1 * 1.35 / 10) * 10);
  }
  function fmtDist(m){ return m >= 1000 ? (m / 1000).toFixed(1) + " km" : m + " m"; }
  function walkMin(m){ return Math.max(1, Math.round(m / 80)); }

  /* ---------- filters ---------- */
  function matches(t){
    if(state.cat !== "all" && t.cat !== state.cat) return false;
    var feats = Array.from(state.feats);
    for(var i = 0; i < feats.length; i++){
      var f = feats[i];
      if(f === "quiet"){ if(t.crowd !== "低") return false; }
      else if(!t[f]) return false;
    }
    var q = state.q.trim();
    if(q){
      var hay = t.name + t.sub + t.area + CATS[t.cat].label + t.tip;
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  /* ---------- chips ---------- */
  var catWrap = document.getElementById("catChips");
  var cats = ["all"].concat(Object.keys(CATS));
  catWrap.innerHTML = cats.map(function(k){
    var label = k === "all" ? "全部" : CATS[k].label;
    return '<button type="button" class="chip' + (k === "all" ? " active" : "") + '" data-cat="' + k + '">' + label + '</button>';
  }).join("");

  var featDefs = [
    {k:"access", label:"无障碍"},
    {k:"paper", label:"有纸巾"},
    {k:"h24", label:"24 小时"},
    {k:"quiet", label:"少排队"}
  ];
  document.getElementById("featChips").innerHTML = featDefs.map(function(f){
    return '<button type="button" class="chip feat" data-feat="' + f.k + '" aria-pressed="false">' + f.label + '</button>';
  }).join("");

  catWrap.addEventListener("click", function(e){
    var btn = e.target.closest("[data-cat]");
    if(!btn) return;
    state.cat = btn.dataset.cat;
    $all("[data-cat]", catWrap).forEach(function(b){ b.classList.toggle("active", b === btn); });
    renderAll();
  });

  document.getElementById("featChips").addEventListener("click", function(e){
    var btn = e.target.closest("[data-feat]");
    if(!btn) return;
    var k = btn.dataset.feat;
    if(state.feats.has(k)){ state.feats.delete(k); } else { state.feats.add(k); }
    btn.classList.toggle("active", state.feats.has(k));
    btn.setAttribute("aria-pressed", state.feats.has(k) ? "true" : "false");
    renderAll();
  });

  var originWrap = document.getElementById("originChips");
  originWrap.innerHTML = Object.keys(ORIGINS).map(function(k){
    return '<button type="button" class="ochip' + (k === state.origin ? " active" : "") + '" data-origin="' + k + '">' + ORIGINS[k].label + '</button>';
  }).join("");

  originWrap.addEventListener("click", function(e){
    var btn = e.target.closest("[data-origin]");
    if(!btn) return;
    setOrigin(btn.dataset.origin, true);
  });

  function setOrigin(key, announce){
    state.origin = key;
    $all("[data-origin]", originWrap).forEach(function(b){
      b.classList.toggle("active", b.dataset.origin === key);
    });
    var o = getOrigin();
    originG.setAttribute("transform", "translate(" + o.x + "," + o.y + ")");
    originG.classList.add("show");
    renderAll();
    if(state.selected){
      var t = getToilet(state.selected);
      updateDetailDistance(t);
      drawRoute(t);
    }
    if(announce) showToast("我的位置已设为「" + o.label + "」，距离已重新计算");
  }

  /* ---------- list ---------- */
  function renderList(){
    var items = TOILETS.filter(matches).slice().sort(function(a, b){ return meters(a) - meters(b); });
    document.getElementById("count").textContent = items.length + " 处";

    if(!items.length){
      listEl.innerHTML = '<div class="empty"><b>没有符合条件的点位</b>试试取消筛选，或换一个关键词。</div>';
      return;
    }

    listEl.innerHTML = items.map(function(t){
      var c = CATS[t.cat].color;
      var tags = "";
      if(t.paper) tags += '<i class="tag paper">纸巾</i>';
      if(t.access) tags += '<i class="tag access">无障碍</i>';
      if(t.h24) tags += '<i class="tag h24">24H</i>';
      if(!tags) tags = '<i class="tag">需自备纸巾</i>';
      return '<button type="button" class="item' + (state.selected === t.id ? " active" : "") + '" data-id="' + t.id + '">' +
        '<span class="num" style="--c:' + c + '">' + t.id + '</span>' +
        '<span class="item-main">' +
          '<span class="item-title">' + t.name + '<span style="font-weight:400;color:#8A8168;font-size:10.5px"> · ' + t.sub + '</span></span>' +
          '<span class="item-sub">' + t.area + ' · ' + t.hours + '</span>' +
          '<span class="tags">' + tags + '</span>' +
        '</span>' +
        '<span class="dist">' + fmtDist(meters(t)) + '</span>' +
      '</button>';
    }).join("");
  }

  listEl.addEventListener("click", function(e){
    var item = e.target.closest(".item");
    if(!item) return;
    select(Number(item.dataset.id));
  });

  /* ---------- detail ---------- */
  var CROWD = {
    "低":{w:30, color:"#6E9C6A"},
    "中":{w:62, color:"#C9A227"},
    "高":{w:92, color:"#B5462F"}
  };

  function showDetail(t){
    var c = CATS[t.cat].color;
    var crowd = CROWD[t.crowd];
    var m = meters(t);
    detailEl.style.setProperty("--c", c);
    detailEl.innerHTML =
      '<button type="button" class="detail-close" id="detailClose" aria-label="关闭详情">×</button>' +
      '<div class="detail-head">' +
        '<span class="badge" style="--c:' + c + '">' + t.id + '</span>' +
        '<div><h3>' + t.name + '</h3><p>' + t.area + ' · ' + t.sub + ' · ' + CATS[t.cat].label + '</p></div>' +
      '</div>' +
      '<div class="stats">' +
        '<div><span>开放时间</span><b>' + t.hours + '</b></div>' +
        '<div><span>坑位</span><b>' + t.stalls + ' 个</b></div>' +
        '<div><span>纸巾</span><b class="' + (t.paper ? "yes" : "no") + '">' + (t.paper ? "有" : "需自备") + '</b></div>' +
        '<div><span>无障碍</span><b class="' + (t.access ? "yes" : "no") + '">' + (t.access ? "有" : "无") + '</b></div>' +
      '</div>' +
      '<div class="crowd"><span>拥挤度</span><div class="bar"><i style="width:' + crowd.w + '%;background:' + crowd.color + '"></i></div><b>' + t.crowd + '</b></div>' +
      '<div class="tipbox"><span>TIPS</span><p>' + t.tip + '</p></div>' +
      '<div class="detail-foot">' +
        '<span class="walk" id="walkText">从 <b>' + getOrigin().label + '</b> 步行约 <b>' + fmtDist(m) + '</b> · ' + walkMin(m) + ' 分钟</span>' +
        '<button type="button" class="btn-ghost" id="routeBtn">绘制路线</button>' +
      '</div>';

    detailEl.classList.add("show");
    detailEl.classList.toggle("right", t.x <= 500);

    $("#detailClose", detailEl).addEventListener("click", deselect);
    $("#routeBtn", detailEl).addEventListener("click", function(){
      drawRoute(t);
      showToast("路线：从「" + getOrigin().label + "」到「" + t.name + "」，约 " + fmtDist(m));
    });
  }

  function updateDetailDistance(t){
    var walk = document.getElementById("walkText");
    if(!walk) return;
    var m = meters(t);
    walk.innerHTML = '从 <b>' + getOrigin().label + '</b> 步行约 <b>' + fmtDist(m) + '</b> · ' + walkMin(m) + ' 分钟';
  }

  function deselect(){
    state.selected = null;
    $all(".marker", markersG).forEach(function(m){ m.classList.remove("selected"); });
    detailEl.classList.remove("show");
    routeEl.classList.remove("show");
    $all(".item", listEl).forEach(function(i){ i.classList.remove("active"); });
  }

  function select(id){
    var t = getToilet(id);
    if(!t) return;
    state.selected = id;
    $all(".marker", markersG).forEach(function(m){
      m.classList.toggle("selected", Number(m.dataset.id) === id);
    });
    var marker = $('.marker[data-id="' + id + '"]', markersG);
    if(marker && marker.parentNode) marker.parentNode.appendChild(marker);
    renderAll();
    showDetail(t);
    drawRoute(t);
    var item = $('.item[data-id="' + id + '"]', listEl);
    if(item && item.scrollIntoView) item.scrollIntoView({block:"nearest"});
  }

  function drawRoute(t){
    var o = getOrigin();
    var dx = t.x - o.x, dy = t.y - o.y;
    var len = Math.hypot(dx, dy) || 1;
    var nx = -dy / len * 20, ny = dx / len * 20;
    var mx = (o.x + t.x) / 2 + nx;
    var my = (o.y + t.y) / 2 + ny;
    routeEl.setAttribute("d", "M" + o.x + "," + o.y + " Q" + mx + "," + my + " " + t.x + "," + (t.y - 4));
    routeEl.classList.add("show");
    originG.setAttribute("transform", "translate(" + o.x + "," + o.y + ")");
    originG.classList.add("show");
  }

  /* ---------- marker events ---------- */
  $all(".marker", markersG).forEach(function(m){
    var t = getToilet(Number(m.dataset.id));
    m.addEventListener("mouseenter", function(e){ showTip(t, e); });
    m.addEventListener("mousemove", moveTip);
    m.addEventListener("mouseleave", hideTip);
    m.addEventListener("click", function(e){ e.stopPropagation(); hideTip(); select(t.id); });
    m.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); select(t.id); }
    });
  });

  function showTip(t, evt){
    tipEl.innerHTML = "<b>" + t.id + "</b> " + t.name +
      "<span>" + t.sub + " · 步行约 " + fmtDist(meters(t)) + "</span>";
    moveTip(evt);
    tipEl.classList.add("show");
  }
  function moveTip(evt){
    var r = mapWrap.getBoundingClientRect();
    tipEl.style.left = (evt.clientX - r.left) + "px";
    tipEl.style.top = (evt.clientY - r.top - 14) + "px";
  }
  function hideTip(){ tipEl.classList.remove("show"); }

  /* ---------- map background / keyboard ---------- */
  document.getElementById("map").addEventListener("click", function(e){
    if(!e.target.closest(".marker")) deselect();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ deselect(); hideTip(); }
  });

  /* ---------- search ---------- */
  var searchInput = document.getElementById("search");
  searchInput.addEventListener("input", function(){
    state.q = searchInput.value;
    renderAll();
  });

  /* ---------- toast ---------- */
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2800);
  }

  /* ---------- urgent ---------- */
  document.getElementById("urgent").addEventListener("click", function(){
    var nearest = TOILETS.slice().sort(function(a, b){ return meters(a) - meters(b); })[0];
    select(nearest.id);
    showToast("最近的洗手间：" + nearest.name + " · 步行约 " + fmtDist(meters(nearest)) + "（" + walkMin(meters(nearest)) + " 分钟）");
  });

  /* ---------- legend + stats ---------- */
  document.getElementById("legend").innerHTML = Object.keys(CATS).map(function(k){
    return '<span><i style="background:' + CATS[k].color + '"></i>' + CATS[k].label + '</span>';
  }).join("") + '<span><i style="background:#2B6E9B"></i>我的位置</span>';

  document.getElementById("statTotal").textContent = TOILETS.length;
  document.getElementById("stat24").textContent = TOILETS.filter(function(t){ return t.h24; }).length;
  document.getElementById("statAccess").textContent = TOILETS.filter(function(t){ return t.access; }).length;

  /* ---------- render ---------- */
  function renderAll(){
    renderList();
    $all(".marker", markersG).forEach(function(m){
      var t = getToilet(Number(m.dataset.id));
      m.classList.toggle("dim", !matches(t));
    });
  }

  setOrigin("huaishi", false);
  renderAll();

  var hashId = parseInt((location.hash || "").replace("#", ""), 10);
  if(hashId && getToilet(hashId)) select(hashId);
})();
</script>
</body>
</html>
